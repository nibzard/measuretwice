\* Main configuration: the complete profile lifecycle. Two artifact
\* slots cover the good candidate and the foreign or stale one. The
\* environment chooses the definition and the declared scope of each
\* slot in the initial state.
CONSTANTS
  NumProfiles = 2
  MaxRejections = 2
SPECIFICATION Spec
INVARIANT
  TypeOK
  EnforcementAdmissionSound
  RunsDoNotPromote
  HostStateHostControlled
  ShadowPassNeverAuthorizes
  DriftInvalidatesStaleBindings
  ValidatedProfilesBindLoadedDefinition
