\* Saturation configuration: queue_full skips and single attempts.
\* Three checks compete for one active slot and zero pending slots, so
\* two checks must record queue_full.
CONSTANTS
  NumChecks = 3
  MaxActive = 1
  MaxPending = 0
  MaxAttempts = 1
SPECIFICATION Spec
INVARIANT
  TypeOK
  ActiveWithinLimit
  FreshPendingWithinLimit
  AttemptsBounded
  AttemptBindingStable
  StatePartition
  NoErrorSkipToPass
  TerminalReportFrozen
  TerminalRecordsComplete
PROPERTY
  RunTerminates
