# Rust workspace for measuretwice.
#
# The core stays free of provider SDKs, network clients, storage, and
# rendering crates. See DEVELOPING.md and MVP_SPEC.md section 5.

[workspace]
resolver = "2"
members = [
    "crates/measuretwice-core",
    "crates/measuretwice-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nibzard/measuretwice"
rust-version = "1.88"

# Prebuilt release artifacts carry no debug symbols, so the published
# binaries stay small without a separate strip tool.
[profile.release]
strip = "debuginfo"

[workspace.dependencies]
measuretwice-core = { version = "0.1.0", path = "crates/measuretwice-core" }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip makes float parsing correctly rounded. The default parser
# can sit one unit in the last place away from the binary64 value, which
# changes canonical forms and hashes, as RFC 8785 requires them.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
# serde-json lets the binding return plain JSON values, such as the
# projected inputs, without a second serialization format.
napi = { version = "3.13.0", features = ["napi8", "serde-json"] }
napi-derive = "3.6.9"
napi-build = "2.5.0"
