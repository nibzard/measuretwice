# Continuous integration for measuretwice.
#
# The jobs cover the declared v0 targets in DEVELOPING.md: the five Rust
# triples, and Node.js 20, 22, and 24 on Linux, plus one job each on
# Windows and macOS. Every job reads no secrets, makes no paid API call,
# and stays deterministic. Live evaluations never run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Floating on purpose: this job must catch what one newer stable
      # compiler rejects, so the toolchain action stays unpinned. Every
      # other action reference is pinned to one commit.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The declared minimum Rust version of Cargo.toml `rust-version`. Every
  # other Rust job floats on stable, so one dependency or one line of code
  # that needs a newer compiler would pass CI and break one declared-minimum
  # user. This job compiles the workspace with the minimum only.
  rust-msrv:
    name: Rust minimum version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the workspace with the declared minimum
        run: cargo check --workspace --all-targets

  # The declared targets without a hosted runner that executes them natively.
  rust-cross:
    name: Rust cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the workspace for the target
        run: cargo check --workspace --target ${{ matrix.target }}

  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "22"
          - os: macos-latest
            node: "22"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the native binding and the package
        run: npm run build
      - name: Type-check the tests
        run: npm run typecheck
      - name: Test
        run: npm run test:ts
